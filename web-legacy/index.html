<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>NOOR — Your Deen. Your Daily Companion. | Global Islamic Digital Ecosystem</title>
  
  <!-- SEO Meta Tags -->
  <meta name="description" content="NOOR is a world-class global Islamic digital ecosystem uniting Prayer Times, Adhan, Qibla, Quran recitations, Hadith, Duas, Tasbih, Islamic Learning, News, and verified AI assistance into one peaceful, trusted daily companion." />
  <meta name="keywords" content="Islamic App, Quran, Prayer Times, Adhan, Qibla, Hadith, Duas, Tasbih, Islamic Learning, Ramadan, Zakat, Hajj, Umrah, Noor" />
  <meta name="theme-color" content="#0F4C3A" />

  <!-- Open Graph -->
  <meta property="og:title" content="NOOR — Your Deen. Your Daily Companion." />
  <meta property="og:description" content="Unified Islamic digital ecosystem uniting Prayer, Quran, Duas, and Knowledge." />
  <meta property="og:type" content="website" />

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%230F4C3A'/><text x='50' y='65' font-size='50' text-anchor='middle' fill='%23C5A059' font-family='serif' font-weight='bold'>ن</text></svg>" />

  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="/src/styles/tokens.css" />
  <link rel="stylesheet" href="/src/styles/typography.css" />
  <link rel="stylesheet" href="/src/styles/components.css" />
  <link rel="stylesheet" href="/src/styles/dark-mode.css" />
  <link rel="stylesheet" href="/src/styles/rtl.css" />
  <link rel="stylesheet" href="/src/styles/app-shell.css" />
  <link rel="stylesheet" href="/src/styles/website.css" />
</head>
<body>

  <!-- ==========================================================================
       TOP CONTROL & VIEWPORT SWITCHER BAR
       Allows seamless switching between Mobile App Simulator and Responsive Web Portal
       ========================================================================== -->
  <div class="noor-control-bar" id="top-control-bar">
    <div class="control-brand">
      <div class="brand-emblem">ن</div>
      <div>
        <span class="brand-title">NOOR</span>
        <span class="brand-tagline-mini">“Your Deen. Your Daily Companion.”</span>
      </div>
    </div>

    <!-- View Mode Switcher -->
    <div class="view-mode-pill">
      <button class="view-mode-btn active" id="btn-mode-mobile" title="Interactive Smartphone Preview">
        📱 <span>Mobile App</span>
      </button>
      <button class="view-mode-btn" id="btn-mode-web" title="12-Column Responsive Web Portal">
        💻 <span>Desktop Website</span>
      </button>
    </div>

    <!-- Control Actions: Location, Auth, Theme, Language, Full Search, Noor AI -->
    <div class="control-actions">
      <!-- Location Auto-detect / Picker -->
      <button class="btn btn-sm btn-ghost" id="btn-top-location" title="Current Location & Auto-detection">
        📍 <span id="top-loc-label">London, UK</span>
      </button>

      <!-- Universal Search Button -->
      <button class="btn-icon btn-icon-sm" id="btn-top-search" title="Universal Search (Quran, Hadith, Duas, Pixabay)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
      </button>

      <!-- Language Selector Button with Native Name & RTL flag -->
      <button class="btn btn-sm btn-secondary" id="btn-top-language" title="Choose Language (80+ Global Languages & RTL)">
        🌐 <span id="top-lang-label">English</span>
      </button>

      <!-- Theme Switcher (Light / Dark) -->
      <button class="btn-icon btn-icon-sm" id="btn-top-theme" title="Toggle Theme (Dark / Light)">
        🌙
      </button>

      <!-- User Login / Account Button -->
      <button class="btn btn-sm btn-secondary" id="btn-top-auth" title="Sign In or View Account">
        👤 <span id="top-user-label">Sign In</span>
      </button>

      <!-- Noor Assistant AI Quick Button -->
      <button class="btn btn-sm btn-primary" id="btn-top-assistant">
        ✨ <span>Noor AI</span>
      </button>
    </div>
  </div>

  <!-- ==========================================================================
       PRIMARY APP WORKSPACE CONTAINER
       Toggles between Mobile Device Frame and Desktop Website Layout
       ========================================================================== -->
  <div id="noor-main-viewport">
    <!-- 1. MOBILE APP SIMULATOR CONTAINER -->
    <div class="mobile-view-wrapper" id="mobile-view-container">
      <div class="smartphone-device" id="smartphone-shell">
        <!-- Status Bar with Dynamic Island -->
        <div class="phone-status-bar">
          <span id="phone-clock">12:36</span>
          <div class="dynamic-island">
            <div class="island-camera"></div>
            <div class="island-sensor"></div>
          </div>
          <div style="display: flex; gap: 6px; font-size: 0.75rem; align-items: center;">
            <span>5G</span>
            <span>100%</span>
          </div>
        </div>

        <!-- Phone Content Screen (Scrollable) -->
        <div class="phone-screen" id="phone-screen-viewport">
          <!-- Views dynamically mounted here (Home, Pray, Quran, Learn, Discover, Profile) -->
        </div>

        <!-- Mobile Bottom Navigation Bar -->
        <nav class="mobile-bottom-nav" id="mobile-bottom-nav">
          <button class="nav-item active" data-nav="home">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
              <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
            <span class="i18n-nav-home">Home</span>
          </button>

          <button class="nav-item" data-nav="pray">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"></circle>
              <polyline points="12 6 12 12 16 14"></polyline>
            </svg>
            <span class="i18n-nav-pray">Pray</span>
          </button>

          <button class="nav-item" data-nav="quran">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
              <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
            </svg>
            <span class="i18n-nav-quran">Quran</span>
          </button>

          <button class="nav-item" data-nav="learn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M22 10v6M2 10l10-5 10 5-10 5z"></path>
              <path d="M6 12v5c3 3 9 3 12 0v-5"></path>
            </svg>
            <span class="i18n-nav-learn">Learn</span>
          </button>

          <button class="nav-item" data-nav="discover">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"></circle>
              <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"></polygon>
            </svg>
            <span class="i18n-nav-discover">Discover</span>
          </button>

          <button class="nav-item" data-nav="me">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
            <span class="i18n-nav-me">Me</span>
          </button>
        </nav>

        <!-- Home Indicator Bar -->
        <div class="phone-home-bar"></div>
      </div>
    </div>

    <!-- 2. DESKTOP RESPONSIVE WEBSITE PORTAL CONTAINER -->
    <div id="website-view-container" style="display: none;">
      <!-- Desktop Website Views dynamically mounted here -->
    </div>
  </div>

  <!-- ==========================================================================
       GLOBAL MODAL DIALOGS & OVERLAYS
       ========================================================================== -->
  <div id="modal-mount-point"></div>

  <!-- Dedicated Modal for Qibla Compass -->
  <div class="modal-overlay" id="qibla-modal-overlay">
    <div class="modal-content" style="max-width: 440px; text-align: center; position: relative;">
      <button class="btn-icon btn-icon-sm" id="close-qibla-modal" style="position: absolute; top: 16px; right: 16px;">✕</button>
      <div id="qibla-compass-mount"></div>
    </div>
  </div>

  <!-- Dedicated Modal for Digital Tasbih -->
  <div class="modal-overlay" id="tasbih-modal-overlay">
    <div class="modal-content" style="max-width: 440px; text-align: center; position: relative;">
      <button class="btn-icon btn-icon-sm" id="close-tasbih-modal" style="position: absolute; top: 16px; right: 16px;">✕</button>
      <div id="tasbih-counter-mount"></div>
    </div>
  </div>

  <!-- Dedicated Modal for Zakat Calculator -->
  <div class="modal-overlay" id="zakat-modal-overlay">
    <div class="modal-content" style="max-width: 580px; position: relative;">
      <button class="btn-icon btn-icon-sm" id="close-zakat-modal" style="position: absolute; top: 16px; right: 16px;">✕</button>
      <div id="zakat-calculator-mount"></div>
    </div>
  </div>

  <!-- Dedicated Modal for Pilgrimage Guide -->
  <div class="modal-overlay" id="pilgrim-modal-overlay">
    <div class="modal-content" style="max-width: 620px; position: relative;">
      <button class="btn-icon btn-icon-sm" id="close-pilgrim-modal" style="position: absolute; top: 16px; right: 16px;">✕</button>
      <div id="pilgrim-guide-mount"></div>
    </div>
  </div>

  <!-- Dedicated Modal for Ramadan Hub -->
  <div class="modal-overlay" id="ramadan-modal-overlay">
    <div class="modal-content" style="max-width: 540px; position: relative;">
      <button class="btn-icon btn-icon-sm" id="close-ramadan-modal" style="position: absolute; top: 16px; right: 16px;">✕</button>
      <div id="ramadan-hub-mount"></div>
    </div>
  </div>

  <!-- Dedicated Modal for AI Assistant -->
  <div class="modal-overlay" id="assistant-modal-overlay">
    <div class="modal-content" style="max-width: 600px; position: relative;">
      <button class="btn-icon btn-icon-sm" id="close-assistant-modal" style="position: absolute; top: 16px; right: 16px;">✕</button>
      <div id="assistant-mount"></div>
    </div>
  </div>

  <!-- Dedicated Modal for Mosque Finder -->
  <div class="modal-overlay" id="mosque-modal-overlay">
    <div class="modal-content" style="max-width: 600px; position: relative;">
      <button class="btn-icon btn-icon-sm" id="close-mosque-modal" style="position: absolute; top: 16px; right: 16px;">✕</button>
      <div style="margin-bottom: var(--space-4);">
        <span class="badge badge-emerald">Find Mosques</span>
        <h3 class="font-h2" style="margin-top: 4px;">Mosques Near Me (London)</h3>
      </div>
      <div id="mosque-finder-mount"></div>
    </div>
  </div>

  <!-- ==========================================================================
       PERSISTENT AUDIO PLAYER BAR
       ========================================================================== -->
  <div class="global-audio-bar hidden" id="global-audio-bar">
    <div class="audio-track-info">
      <div class="audio-thumb">▶</div>
      <div>
        <strong id="audio-bar-title" class="font-body-sm" style="display: block;">Surah Al-Fatihah</strong>
        <span id="audio-bar-subtitle" class="font-caption" style="color: var(--text-muted);">Mishary Rashid Alafasy</span>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: var(--space-3);">
      <button class="btn btn-sm btn-primary" id="btn-audio-toggle">Pause</button>
      <button class="btn-icon btn-icon-sm" id="btn-audio-close">✕</button>
    </div>
  </div>

  <!-- Main JavaScript Bootstrap -->
  <script type="module" src="/src/main.js"></script>
</body>
</html>
